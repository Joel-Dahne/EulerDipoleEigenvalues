review:
  status: unchecked
  notes: "Provisional: describe the human review actually performed before submission."

fidelity:
  divergences: >-
    The Challenge states the result with a weak Fourier formulation of the
    inverse Laplacian and transport. It assumes that transport of the
    vorticity plus stream is in L², rather than imposing a separate transport
    domain condition on the vorticity. The blueprint proves transport of
    the stream is in L², which bridges these domain formulations.

