# Palomar metadata draft: confirm credits, automation details and review status before submission.
version: "v0.4"

project:
  name: "Absence of nonzero embedded eigenvalues for the linearized Euler dipole"
  description: >-
    Lean formalization of the absence of nonzero purely imaginary eigenvalues
    for the two-dimensional Euler equation linearized around the dipole on
    the flat torus. The compared results include the Fourier-character
    formulas, the existence and uniqueness of the mean-zero inverse Laplacian,
    agreement of the weak transport operator with classical transport on
    Fourier characters, and an example showing that zero is an eigenvalue.
  authors:
    - Joel Dahne
    - Hao Jia
  license: MIT
  responsible_maintainers:
    - Joel Dahne

classification:
  arxiv: [math.AP]
  msc2020: [35Q31, 76E09]

sources:
  - title: "Absence of nonzero embedded eigenvalues for the two-dimensional Euler equation linearized around the dipole"
    authors:
      - Joel Dahne
      - Hao Jia
    type: paper
    location: "https://github.com/Joel-Dahne/EulerDipoleEigenvalues/blob/45765253879a22d9eeb87f9d3b37143614d7d50a/Manuscript/eigenvalues.tex"
    relationship: formalizes
    note: >-
      Unpublished, largely AI-generated working manuscript preserved as the
      source of the theorem labelled Intm6. The Lean proof follows the
      sector-based approach but repairs or replaces parts of the argument.

