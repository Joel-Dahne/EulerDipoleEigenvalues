name = "NoEmbeddedEigenvalues"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["NoEmbeddedEigenvalues", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # Mathlib's copyright header requirement
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "NoEmbeddedEigenvalues"

# The trusted statement (`Challenge.lean`, Mathlib only) and its proof (`Solution.lean`),
# compared by the comparator, see `comparator.json`.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
